<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" type="text/css" href="style.css">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; }

    /* FORZA I CONTROLLI CENTRALI AD APPARIRE OVUNQUE SI TROVI IL MOUSE */
    body:hover #mini-art-overlay {
      opacity: 1 !important;
      visibility: visible !important;
    }

    /* FORZA I BOTTONI IN ALTO (Chiudi e Testo) AD APPARIRE OVUNQUE */
    body:hover #mini-top-actions {
      opacity: 1 !important;
      visibility: visible !important;
    }

  </style>
</head>
<body>

  <div id="shell" class="mini-mode">
    <div id="player-bar">
      <div id="mini-bar">
        
        <div id="mini-drag-strip">
          <div class="mini-drag-handle"></div>
        </div>

        <div id="mini-art-wrap">
          <div id="mini-art"></div>
          <video id="mini-video-art" autoplay loop muted playsinline crossorigin="anonymous"></video>
          
          <div id="mini-art-overlay">
            <button class="mini-overlay-btn" onclick="sendCommand('prev')">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><polygon points="19,20 9,12 19,4"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="mini-overlay-play" id="mini-play-btn" onclick="sendCommand('togglePlay')">
              <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><polygon points="5,3 19,12 5,21"/></svg>
            </button>
            <button class="mini-overlay-btn" onclick="sendCommand('next')">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
            </button>
          </div>
        </div>

        <div id="mini-top-actions">
          <button id="mini-lyrics-btn" class="mini-top-btn" type="button" title="Lyric">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
          </button>
          
          <button id="mini-expand-btn-top" class="mini-top-btn" type="button" title="Chiudi Mini Player" onclick="window.close()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div id="mini-lyrics-panel">
          <div id="mini-lyrics-scroll">
            <div id="mini-lyrics-content">
              <div class="mini-lyrics-empty">Testo non disponibile.</div>
            </div>
          </div>
        </div>

        <div id="mini-info">
          <div id="mini-title">No track playing</div>
          <div id="mini-artist">—</div>
        </div>

        <div id="mini-seek">
          <div id="mini-seek-fill"></div>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { coverVideoManager } from './apple.js';

    // Mock delle impostazioni per dire a apple.js che le animazioni sono abilitate
    window.app = window.app || { _settings: { animatedCovers: true } };

    const SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><polygon points="5,3 19,12 5,21"/></svg>';
    const SVG_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

    // Essendo in un modulo, dobbiamo esporre le funzioni al window per i bottoni in HTML
    window.sendCommand = function(action, payload = null) {
      if (window.electronAPI && window.electronAPI.sendMiniAction) {
        window.electronAPI.sendMiniAction(action, payload);
      }
    };

    function centerActiveMiniLyric() {
      const scroll = document.getElementById('mini-lyrics-scroll');
      const active = document.querySelector('#mini-lyrics-content .mini-lyrics-line.active');
      if (!scroll || !active) return;

      const top = active.offsetTop - (scroll.clientHeight / 2) + (active.clientHeight / 2);
      scroll.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }

    document.getElementById('mini-lyrics-btn').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const miniBar = document.getElementById('mini-bar');
      miniBar.classList.toggle('show-mini-lyrics');
      this.classList.toggle('active');
      if (miniBar.classList.contains('show-mini-lyrics')) {
        setTimeout(centerActiveMiniLyric, 50);
      }
    });

    if (window.electronAPI && window.electronAPI.onUpdateMiniUI) {
      let currentTrackId = null;

      window.electronAPI.onUpdateMiniUI((data) => {
        document.getElementById('mini-title').textContent = data.title;
        document.getElementById('mini-artist').textContent = data.artist;
        document.getElementById('mini-play-btn').innerHTML = data.isPlaying ? SVG_PAUSE : SVG_PLAY;
        
        // Copertina statica di fallback
        const artDiv = document.getElementById('mini-art');
        if (data.cover) {
          artDiv.style.backgroundImage = `url('${data.cover}')`;
        } else {
          artDiv.style.backgroundImage = 'none';
          artDiv.textContent = '♪';
        }

        // --- LA MAGIA: APPLE.JS GESTISCE IL VIDEO DIRETTAMENTE ---
        const videoEl = document.getElementById('mini-video-art');
        if (videoEl) {
          if (data.animatedCovers && data.track) {
            // Se l'opzione è attiva ed è un nuovo brano (o era stato precedentemente spento)
            if (data.track.id !== currentTrackId || videoEl.style.opacity === '0') {
              currentTrackId = data.track.id;
              coverVideoManager.play(videoEl, data.track, 'square');
              videoEl.style.opacity = '1';
            }
          } else {
            // Se l'opzione viene spenta, fermiamo il video immediatamente e resettiamo l'id
            currentTrackId = null;
            coverVideoManager.stop(videoEl);
            videoEl.style.opacity = '0';
          }
        }

        // Sincronizzazione testi
        if (data.lyricsHtml) {
          document.getElementById('mini-lyrics-content').innerHTML = data.lyricsHtml;
          if (document.getElementById('mini-bar').classList.contains('show-mini-lyrics')) {
            centerActiveMiniLyric();
          }
        }

        // Sincronizzazione Barra temporale
        const fill = document.getElementById('mini-seek-fill');
        if (data.duration && data.duration > 0) {
          const pct = (data.currentTime / data.duration) * 100;
          fill.style.width = pct + '%';
        } else {
          fill.style.width = '0%';
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      sendCommand('request-sync');
    });

  </script>
</body>
</html>
